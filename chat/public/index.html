<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d5dfc" />
  <title>الدردشة العامة</title>
  <style>
    :root {
      --bg: #f7f7ff;
      --surface: #ffffff;
      --surface-2: #f1efff;
      --text: #17162a;
      --muted: #6d6a82;
      --primary: #6d5dfc;
      --primary-2: #8a7cff;
      --danger: #e5484d;
      --success: #2d9d78;
      --border: #e6e3f4;
      --shadow: 0 16px 40px rgba(45, 36, 100, .12);
      --radius: 22px;
    }
    [data-theme="dark"] {
      --bg: #11101a;
      --surface: #1a1826;
      --surface-2: #242038;
      --text: #f7f5ff;
      --muted: #b9b4ca;
      --primary: #8a7cff;
      --primary-2: #a99fff;
      --danger: #ff6b70;
      --success: #56c89f;
      --border: #332f46;
      --shadow: 0 16px 40px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.16), transparent 32%),
        radial-gradient(circle at 95% 10%, rgba(255,184,77,.14), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }

    .app {
      width: min(100%, 820px);
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
      gap: 12px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; white-space: nowrap; }
    @media (max-width: 420px) { .brand { font-size: 15px; } .brand-badge { width: 36px; height: 36px; font-size: 18px; } .icon-btn { width: 38px; height: 38px; } }
    .brand-badge {
      width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff;
      box-shadow: var(--shadow); font-size: 22px;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--muted); white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--success); box-shadow: 0 0 0 4px rgba(45,157,120,.18); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface); display: grid; place-items: center; font-size: 18px;
    }

    .chat {
      flex: 1; min-height: 0; overflow-y: auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }
    .empty { margin: auto; text-align: center; color: var(--muted); }
    .empty b { display: block; font-size: 40px; }
    .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; animation: pop .18s ease-out; }
    .msg.mine { align-self: flex-start; flex-direction: row; }
    .msg.other { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      flex: none; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center;
      color: #fff; font-weight: 900; font-size: 15px;
    }
    .bubble { padding: 8px 12px; border-radius: 16px; background: var(--surface-2); min-width: 0; }
    .mine .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
    .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; margin-bottom: 2px; }
    .meta .name { font-weight: 900; }
    .meta .time { opacity: .7; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .system { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 4px 12px; border-radius: 999px; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

    .composer {
      display: flex; gap: 8px; align-items: flex-end; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
    }
    .composer textarea {
      flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent;
      padding: 8px 10px; max-height: 140px; line-height: 1.5;
    }
    .send {
      flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 14px; font-weight: 900; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }
    .counter { font-size: 11px; color: var(--muted); align-self: center; }
    .error { color: var(--danger); font-size: 13px; min-height: 1em; text-align: center; }

    .modal {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: rgba(17,16,26,.55); backdrop-filter: blur(4px); z-index: 10;
    }
    .modal[hidden] { display: none; }
    .card {
      width: min(100%, 380px); background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 22px; box-shadow: var(--shadow); text-align: center;
    }
    .card h2 { margin: 0 0 4px; }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .card input {
      width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface-2); outline: 0; margin-bottom: 12px; text-align: center;
    }
    .card input:focus { border-color: var(--primary); }
    .colors { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; }
    .swatch.sel { border-color: var(--text); }
    .card .send { width: 100%; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-badge">💬</span><span>الدردشة العامة</span></div>
      <div class="top-actions">
        <span class="pill"><span class="dot" id="statusDot"></span><span id="online">جارٍ الاتصال…</span></span>
        <button class="icon-btn" id="renameBtn" title="تغيير الاسم" aria-label="تغيير الاسم">👤</button>
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <div class="empty" id="empty"><b>👋</b>لا توجد رسائل بعد، كن أول من يكتب!</div>
    </main>

    <div class="error" id="error"></div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" maxlength="500" placeholder="اكتب رسالتك…" aria-label="الرسالة"></textarea>
      <span class="counter" id="counter">0/500</span>
      <button class="send" type="submit" id="sendBtn">إرسال</button>
    </form>
  </div>

  <div class="modal" id="nameModal" hidden>
    <form class="card" id="nameForm">
      <h2>أهلًا بك 👋</h2>
      <p>اختر اسمًا ولونًا للدخول إلى الدردشة العامة</p>
      <input id="nameInput" maxlength="24" placeholder="اسمك" autocomplete="nickname" required />
      <div class="colors" id="colors"></div>
      <button class="send" type="submit">دخول</button>
    </form>
  </div>

  <script>
    (() => {
      const COLORS = ['#6d5dfc', '#e5484d', '#2d9d78', '#f59e0b', '#0ea5e9', '#d946ef', '#14b8a6', '#64748b'];
      const $ = (id) => document.getElementById(id);
      const chat = $('chat'), input = $('input'), errorEl = $('error');
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      };

      let me = { name: store.get('chat.name') || '', color: store.get('chat.color') || COLORS[0] };
      let source = null;
      const seen = new Set();

      // الوضع الليلي
      const applyTheme = (t) => {
        document.documentElement.dataset.theme = t;
        $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
      };
      applyTheme(store.get('chat.theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      $('themeBtn').onclick = () => {
        const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        store.set('chat.theme', t);
        applyTheme(t);
      };

      // اختيار الاسم واللون
      function renderSwatches() {
        $('colors').innerHTML = '';
        COLORS.forEach((c) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'swatch' + (c === me.color ? ' sel' : '');
          b.style.background = c;
          b.setAttribute('aria-label', 'لون ' + c);
          b.onclick = () => { me.color = c; renderSwatches(); };
          $('colors').appendChild(b);
        });
      }
      function openNameModal() {
        $('nameInput').value = me.name;
        renderSwatches();
        $('nameModal').hidden = false;
        setTimeout(() => $('nameInput').focus(), 50);
      }
      $('renameBtn').onclick = openNameModal;
      $('nameForm').onsubmit = (e) => {
        e.preventDefault();
        const name = $('nameInput').value.trim().slice(0, 24);
        if (!name) return;
        me.name = name;
        store.set('chat.name', me.name);
        store.set('chat.color', me.color);
        $('nameModal').hidden = true;
        connect();
        input.focus();
      };

      // عرض الرسائل
      const fmtTime = (t) => new Date(t).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
      const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;

      function addMessage(m) {
        if (seen.has(m.id)) return;
        seen.add(m.id);
        $('empty').hidden = true;
        const mine = m.name === me.name;
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (mine ? 'mine' : 'other');

        const av = document.createElement('div');
        av.className = 'avatar';
        av.style.background = m.color;
        av.textContent = [...m.name][0] || '?';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = m.name;
        if (!mine) nm.style.color = m.color;
        const tm = document.createElement('span');
        tm.className = 'time';
        tm.textContent = fmtTime(m.time);
        meta.append(nm, tm);
        const tx = document.createElement('div');
        tx.className = 'text';
        tx.textContent = m.text;
        bubble.append(meta, tx);

        wrap.append(av, bubble);
        const stick = nearBottom() || mine;
        chat.appendChild(wrap);
        if (stick) chat.scrollTop = chat.scrollHeight;
      }

      function setOnline(text, on) {
        $('online').textContent = text;
        $('statusDot').classList.toggle('on', on);
      }

      // الاتصال المباشر
      function connect() {
        if (source) source.close();
        source = new EventSource('api/stream?name=' + encodeURIComponent(me.name));
        source.addEventListener('history', (e) => {
          JSON.parse(e.data).forEach(addMessage);
          chat.scrollTop = chat.scrollHeight;
        });
        source.addEventListener('message', (e) => addMessage(JSON.parse(e.data)));
        source.addEventListener('presence', (e) => {
          const n = JSON.parse(e.data).online;
          setOnline(n + ' متصل الآن', true);
        });
        source.onerror = () => setOnline('إعادة الاتصال…', false);
      }

      // إرسال الرسائل
      const autosize = () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
        $('counter').textContent = input.value.length + '/500';
      };
      input.addEventListener('input', autosize);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          $('composer').requestSubmit();
        }
      });

      $('composer').onsubmit = async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        if (!me.name) return openNameModal();
        $('sendBtn').disabled = true;
        errorEl.textContent = '';
        try {
          const res = await fetch('api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: me.name, color: me.color, text }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || 'تعذر إرسال الرسالة.');
          }
          input.value = '';
          autosize();
        } catch (err) {
          errorEl.textContent = err.message || 'تعذر الاتصال بالخادم.';
        } finally {
          $('sendBtn').disabled = false;
          input.focus();
        }
      };

      if (me.name) connect(); else openNameModal();
    })();
  </script>
</body>
</html>
